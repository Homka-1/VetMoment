services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vetmoment_app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=vetmoment
      - DB_USERNAME=vet_user
      - DB_PASSWORD=vet_pass

  db:
    image: postgres:15-alpine
    container_name: vetmoment_db
    environment:
      - POSTGRES_DB=vetmoment
      - POSTGRES_USER=vet_user
      - POSTGRES_PASSWORD=vet_pass
    ports:
      - "5432:5432"
    volumes:
      - vetmoment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vet_user -d vetmoment"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vetmoment_pgdata:
